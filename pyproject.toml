[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enerfl"
version = "0.1.0"
description = "Lightweight, pluggable energy/carbon/timing profiler for Flower federated learning."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "codecarbon>=3.2.0",
    "protobuf>=5.28.0",
]

[project.optional-dependencies]
flower = ["flwr>=1.31.0,<1.45.0"]
dataframe = ["pandas>=2.0.0"]
dev = ["enerfl[flower]", "pytest>=8.0.0", "pandas>=2.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/enerfl"]
